<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Morrow" />
  <meta name="description" content="Morrow — music, shaped around you." />
  <title>Morrow</title>
  <link rel="icon" href="assets/morrow-logo.png" type="image/png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="vendor/phosphor/regular/style.css" />
  <link rel="stylesheet" href="vendor/phosphor/fill/style.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <button class="brand" data-view="home" aria-label="Morrow home">
        <img src="assets/morrow-logo.png" alt="" />
        <span>Morrow</span>
      </button>

      <nav class="primary-nav">
        <button class="nav-item is-active" data-view="home"><i class="ph ph-house" aria-hidden="true"></i><span>For You</span></button>
        <button class="nav-item" data-view="search"><i class="ph ph-magnifying-glass" aria-hidden="true"></i><span>Search</span></button>
        <button class="nav-item" data-view="library"><i class="ph ph-books" aria-hidden="true"></i><span>Library</span></button>
        <button class="nav-item" data-view="following"><i class="ph ph-users" aria-hidden="true"></i><span>Following</span></button>
      </nav>

      <button class="nav-item settings-trigger" id="settingsBtn"><i class="ph ph-gear" aria-hidden="true"></i><span>Settings</span></button>
    </aside>

    <main class="main">
      <header class="topbar">
        <label class="search-field" for="globalSearch">
          <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
          <input id="globalSearch" type="search" autocomplete="off" spellcheck="false" placeholder="Search songs, artists, playlists…" aria-label="Search songs, artists, and playlists" />
          <kbd>⌘ K</kbd>
        </label>
        <button id="profileButton" class="profile-button" aria-label="Profile and account"><span>MO</span></button>
      </header>

      <section id="view" class="view" aria-live="polite"></section>
    </main>

    <nav class="mobile-nav" aria-label="Primary navigation">
      <button class="mobile-nav-item is-active" data-view="home"><i class="ph ph-house" aria-hidden="true"></i><span>For You</span></button>
      <button class="mobile-nav-item" data-view="search"><i class="ph ph-magnifying-glass" aria-hidden="true"></i><span>Search</span></button>
      <button class="mobile-nav-item" data-view="library"><i class="ph ph-books" aria-hidden="true"></i><span>Library</span></button>
      <button class="mobile-nav-item" data-view="following"><i class="ph ph-users" aria-hidden="true"></i><span>Following</span></button>
    </nav>

    <section id="miniPlayer" class="mini-player" aria-label="Mini player">
      <button id="openNowPlaying" class="mini-track" aria-label="Open full screen player">
        <span id="playerArt" class="art mini-art"></span>
        <span class="track-copy"><strong id="playerTitle">Nothing playing</strong><span id="playerArtist">Choose something to begin</span></span>
      </button>

      <button id="likeCurrentBtn" class="icon-button mini-like" aria-label="Like current track"><i class="ph ph-heart" aria-hidden="true"></i></button>

      <div class="mini-transport">
        <div class="transport-buttons">
          <button id="shuffleBtn" class="icon-button mini-optional" aria-label="Shuffle"><i class="ph ph-shuffle" aria-hidden="true"></i></button>
          <button id="prevBtn" class="icon-button" aria-label="Previous track"><i class="ph ph-skip-back" aria-hidden="true"></i></button>
          <button id="playBtn" class="play-button" aria-label="Play"><i class="ph-fill ph-play" aria-hidden="true"></i></button>
          <button id="nextBtn" class="icon-button" aria-label="Next track"><i class="ph ph-skip-forward" aria-hidden="true"></i></button>
          <button id="autoplayBtn" class="icon-button mini-optional is-active" aria-label="Autoplay"><i class="ph ph-infinity" aria-hidden="true"></i></button>
        </div>
        <div class="timeline">
          <span id="elapsed">0:00</span>
          <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Playback position" />
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="mini-actions">
        <div class="volume-control">
          <button id="muteBtn" class="icon-button" aria-label="Mute"><i class="ph ph-speaker-high" aria-hidden="true"></i></button>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.78" aria-label="Volume" />
        </div>
        <button id="playerQueueBtn" class="icon-button" aria-label="Open queue"><i class="ph ph-queue" aria-hidden="true"></i></button>
        <button id="fullscreenBtn" class="icon-button" aria-label="Open full screen player"><i class="ph ph-arrows-out" aria-hidden="true"></i></button>
      </div>
    </section>
  </div>

  <div id="contextMenu" class="context-menu-layer" aria-hidden="true">
    <button class="context-scrim" data-close-context aria-label="Close menu"></button>
    <div id="contextPanel" class="context-menu" role="menu" aria-label="Track actions"></div>
  </div>

  <div id="queueDrawer" class="drawer" aria-hidden="true">
    <button class="drawer-scrim" data-close-drawer aria-label="Close queue"></button>
    <aside class="drawer-panel" aria-label="Queue">
      <header class="drawer-header">
        <div><span class="overline">PLAYING NEXT</span><h2>Queue</h2></div>
        <button class="icon-button" data-close-drawer aria-label="Close queue"><i class="ph ph-x" aria-hidden="true"></i></button>
      </header>
      <div id="queueList" class="queue-list"></div>
      <footer class="drawer-footer">
        <div><strong>Autoplay</strong><span>Keep the session moving.</span></div>
        <button id="drawerAutoplay" class="switch" role="switch" aria-checked="true" aria-label="Toggle autoplay"><span></span></button>
      </footer>
    </aside>
  </div>

  <div id="nowPlaying" class="now-playing" aria-hidden="true">
    <div class="now-playing-backdrop"></div>
    <header class="now-playing-header">
      <button id="closeNowPlaying" class="icon-button on-dark" aria-label="Close full screen player"><i class="ph ph-caret-down" aria-hidden="true"></i></button>
      <span>Now Playing</span>
      <button id="nowQueueBtn" class="icon-button on-dark" aria-label="Open queue"><i class="ph ph-queue" aria-hidden="true"></i></button>
    </header>
    <section class="now-playing-content">
      <div id="fullArt" class="art full-art"></div>
      <div class="now-playing-details">
        <div class="full-meta">
          <div><h1 id="fullTitle">Nothing playing</h1><p id="fullArtist">Choose something to begin</p></div>
          <button id="fullLikeBtn" class="icon-button on-dark" aria-label="Like current track"><i class="ph ph-heart" aria-hidden="true"></i></button>
        </div>
        <canvas id="visualizer" class="visualizer" width="720" height="86" aria-label="Audio visualization"></canvas>
        <input id="fullSeek" class="full-seek" type="range" min="0" max="1000" value="0" aria-label="Playback position" />
        <div class="full-time"><span id="fullElapsed">0:00</span><span id="fullDuration">0:00</span></div>
        <div class="full-controls">
          <button id="fullShuffleBtn" class="icon-button on-dark" aria-label="Shuffle"><i class="ph ph-shuffle" aria-hidden="true"></i></button>
          <button id="fullPrevBtn" class="icon-button on-dark large" aria-label="Previous track"><i class="ph ph-skip-back" aria-hidden="true"></i></button>
          <button id="fullPlayBtn" class="play-button full-play" aria-label="Play"><i class="ph-fill ph-play" aria-hidden="true"></i></button>
          <button id="fullNextBtn" class="icon-button on-dark large" aria-label="Next track"><i class="ph ph-skip-forward" aria-hidden="true"></i></button>
          <button id="fullAutoplayBtn" class="icon-button on-dark is-active" aria-label="Autoplay"><i class="ph ph-infinity" aria-hidden="true"></i></button>
        </div>
      </div>
    </section>
  </div>

  <div id="settingsModal" class="modal" aria-hidden="true">
    <button class="modal-scrim" data-close-modal aria-label="Close settings"></button>
    <section class="modal-card" aria-label="Settings">
      <header class="drawer-header">
        <div><span class="overline">MORROW</span><h2>Settings</h2></div>
        <button class="icon-button" data-close-modal aria-label="Close settings"><i class="ph ph-x" aria-hidden="true"></i></button>
      </header>
      <div class="setting-row"><div><strong>Autoplay</strong><span>Continue with similar music.</span></div><button id="settingsAutoplay" class="switch" role="switch" aria-checked="true"><span></span></button></div>
      <div class="setting-row"><div><strong>Background playback</strong><span id="backgroundPlaybackNote">Checking this browser…</span></div><span id="backgroundPlaybackStatus" class="status-text">Checking</span></div>
      <div class="setting-row"><div><strong>Music source</strong><span>YouTube Music through Morrow.</span></div><span id="sourceStatus" class="status-text">Connecting</span></div>
      <div class="setting-note" id="platformNote"></div>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <audio id="audio" preload="metadata" playsinline></audio>
  <div id="youtubePlayerHost" aria-hidden="true"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
